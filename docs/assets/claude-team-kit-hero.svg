<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">claude-team-kit hero</title>
  <desc id="desc">A branded overview showing the master-first operating model and core workspace layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#EEF6FF"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="mark" x1="86" y1="88" x2="308" y2="306" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="panel" x1="690" y1="70" x2="1086" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="card-shadow" x="24" y="20" width="1152" height="376" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>

  <g filter="url(#card-shadow)">
    <rect x="56" y="44" width="1088" height="332" rx="26" fill="#FFFFFF"/>
  </g>

  <g transform="translate(92 88)">
    <rect x="0" y="0" width="214" height="214" rx="48" fill="url(#mark)"/>
    <path d="M107 38L169 73V143L107 178L45 143V73L107 38Z" fill="#FFFFFF" fill-opacity="0.18"/>
    <path d="M107 55L151 80V130L107 155L63 130V80L107 55Z" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <path d="M107 55V155" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M63 80L151 130" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M151 80L63 130" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  </g>

  <text x="350" y="132" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="50" font-weight="800">claude-team-kit</text>
  <text x="352" y="178" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">Drop an orchestrated AI team into any repo.</text>
  <text x="352" y="212" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">Start with @master. Build with teams, skills, rules,</text>
  <text x="352" y="246" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">hooks, memory, and local context.</text>

  <g transform="translate(352 292)">
    <rect x="0" y="0" width="130" height="38" rx="19" fill="#E0F2FE"/>
    <text x="65" y="25" text-anchor="middle" fill="#0369A1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="800">53 agents</text>
    <rect x="146" y="0" width="116" height="38" rx="19" fill="#CCFBF1"/>
    <text x="204" y="25" text-anchor="middle" fill="#0F766E" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="800">12 teams</text>
    <rect x="278" y="0" width="110" height="38" rx="19" fill="#FFEDD5"/>
    <text x="333" y="25" text-anchor="middle" fill="#C2410C" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="800">20 skills</text>
  </g>

  <rect x="706" y="72" width="388" height="276" rx="24" fill="url(#panel)"/>
  <text x="742" y="118" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="800">Operational Layers</text>

  <g transform="translate(742 148)">
    <rect x="0" y="0" width="308" height="44" rx="14" fill="#0B3556"/>
    <text x="22" y="28" fill="#D9F2FF" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">1. User request enters @master</text>

    <rect x="0" y="60" width="308" height="44" rx="14" fill="#0F766E"/>
    <text x="22" y="88" fill="#D5FBF5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">2. Teams and agents route the work</text>

    <rect x="0" y="120" width="308" height="44" rx="14" fill="#334155"/>
    <text x="22" y="148" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">3. Gates review, then docs sync</text>
  </g>
</svg>
