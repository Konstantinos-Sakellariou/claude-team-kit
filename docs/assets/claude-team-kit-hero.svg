  <text x="699" y="318" fill="#BFDBFE" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">engineering, data, AI/ML,</text>
  <text x="699" y="336" fill="#BFDBFE" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">delivery, advisory, GitHub</text>

